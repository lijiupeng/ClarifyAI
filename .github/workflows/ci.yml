name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · smoke · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 三个包的类型契约都从 packages/shared 派生，任何一处漂移都要在这里拦住
      - name: Typecheck
        run: npm run typecheck

      # 端到端冒烟：开启会话 → 用户裁决 → 回灌 → 再拆解 → 收口
      - name: Smoke test
        run: npm run smoke -w @clarifyai/server

      # 构建同时验证 tsup 打包与前端产物随包分发
      - name: Build
        run: npm run build
